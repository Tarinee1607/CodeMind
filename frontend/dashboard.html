<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMind - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .navbar-brand { color: white !important; font-weight: bold; }
        .repo-card { transition: transform 0.2s; }
        .repo-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div id="cursor-glow"></div>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">CodeMind</a>
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-outline-info btn-sm" href="history.html">History</a>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4 text-light">Dashboard</h2>
        
        <div class="glass-panel mb-5">
            <h5 class="text-light">Connect a New Repository</h5>
            <form id="connectRepoForm" class="d-flex gap-2 mt-3">
                <input type="url" class="form-control" id="repoUrl" placeholder="https://github.com/user/repo" required>
                <button type="submit" class="btn btn-primary" id="connectBtn" style="white-space: nowrap;">Connect & Ingest</button>
            </form>
            <div id="connectStatus" class="mt-2 text-info"></div>
        </div>

        <h4 class="text-light">Your Connected Repositories</h4>
        <div id="repoList" class="row mt-3">
            <!-- Repos will be injected here -->
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:" || window.location.hostname === "") ? "http://127.0.0.1:8000" : "/api";
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        });

        async function loadRepos() {
            try {
                const response = await fetch(`${API_URL}/repos`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }
                
                const repos = await response.json();
                const repoList = document.getElementById("repoList");
                repoList.innerHTML = "";
                
                if (repos.length === 0) {
                    repoList.innerHTML = `<div class="col-12"><p class="text-muted">No repositories connected yet.</p></div>`;
                    return;
                }
                
                repos.forEach(repo => {
                    const col = document.createElement("div");
                    col.className = "col-md-6 col-lg-4 mb-3";
                    col.innerHTML = `
                        <div class="glass-panel h-100 p-3 repo-card d-flex flex-column">
                            <h5 class="text-truncate text-light" title="${repo.github_url}">${repo.github_url.split('/').pop()}</h5>
                            <p class="text-muted small text-truncate mb-3">${repo.github_url}</p>
                            <a href="chat.html?repo_id=${repo.id}" class="btn btn-outline-primary mt-auto">Chat with Codebase</a>
                        </div>
                    `;
                    repoList.appendChild(col);
                });
            } catch (err) {
                console.error("Failed to load repos", err);
            }
        }

        document.getElementById("connectRepoForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("connectBtn");
            const status = document.getElementById("connectStatus");
            const url = document.getElementById("repoUrl").value;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Processing...`;
            status.textContent = "Cloning and embedding repo... This may take a few minutes.";
            
            try {
                const response = await fetch(`${API_URL}/repos`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ github_url: url })
                });
                
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Failed to connect repo");
                
                status.innerHTML = `<span class="text-success">Success! Processed ${data.chunks_processed} chunks.</span>`;
                document.getElementById("repoUrl").value = "";
                loadRepos();
            } catch (err) {
                status.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Connect & Ingest";
            }
        });

        loadRepos();
    </script>
</body>
</html>
