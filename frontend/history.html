<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMind - Chat History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .navbar-brand { color: white !important; font-weight: bold; }
        .history-card { margin-bottom: 20px; }
        .source-file { font-family: monospace; font-size: 0.85em; background: rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.2); margin-right: 5px; margin-bottom: 5px; display: inline-block; color: #e2e8f0; }
        pre { background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.1); color: #f1f5f9; }
    </style>
</head>
<body>
    <div id="cursor-glow"></div>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="container pb-5">
        <h2 class="mb-4 text-light">Your Chat History</h2>
        
        <div id="historyList">
            <div class="text-center mt-5"><span class="spinner-border text-light"></span> Loading...</div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:" || window.location.hostname === "") ? "http://127.0.0.1:8000" : "/api";
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/history`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }
                
                const history = await response.json();
                const historyList = document.getElementById("historyList");
                historyList.innerHTML = "";
                
                if (history.length === 0) {
                    historyList.innerHTML = `<div class="glass-panel text-center text-muted">No chat history found.</div>`;
                    return;
                }
                
                history.forEach(item => {
                    const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString() : "Unknown date";
                    
                    let formattedAnswer = item.answer.replace(/</g, "&lt;").replace(/>/g, "&gt;")
                                    .replace(/\n/g, "<br>")
                                    .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>")
                                    .replace(/`([^`]+)`/g, "<code>$1</code>");
                                    
                    let sourcesHtml = '';
                    if (item.sources && item.sources.length > 0) {
                        sourcesHtml += `<hr class="border-light"><div class="mt-2"><strong class="d-block mb-1 small text-muted">Sources:</strong>`;
                        item.sources.forEach(src => {
                            let srcText = src.file || src; // Handle both object and string
                            if (src.lines) srcText += `:${src.lines}`;
                            if (src.name) srcText += ` (${src.name})`;
                            sourcesHtml += `<span class="source-file">${srcText}</span>`;
                        });
                        sourcesHtml += `</div>`;
                    }
                    
                    const div = document.createElement("div");
                    div.className = "glass-panel history-card";
                    div.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-primary" style="font-size: 0.9em; padding: 6px 12px; border-radius: 20px;">Repo: ${item.repo_name}</span>
                            <small class="text-muted">${dateStr}</small>
                        </div>
                        <h5 class="text-info mt-3" style="font-weight: 600;">Q: ${item.question}</h5>
                        <div class="mt-3 text-light" style="line-height: 1.6;"><strong>A:</strong><br>${formattedAnswer}</div>
                        ${sourcesHtml}
                    `;
                    historyList.appendChild(div);
                });
            } catch (err) {
                document.getElementById("historyList").innerHTML = `<div class="alert alert-danger">Failed to load history: ${err.message}</div>`;
            }
        }

        loadHistory();
    </script>
</body>
</html>
